<!DOCTYPE html>
<!--
  The template is from Eliza Weisman, then edited by me, Jiahao Cai
  see the original at http://elizas.website
-->
<html>

<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% endif %}
  <title>{{ page.title }}</title>
{% if page.url == "/" %}
  <!-- Structured data: machine-readable identity for search engines. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jiahao Cai",
    "url": "https://jiahao-cai.info",
    "jobTitle": "Co-founder",
    "description": "Founder. Builder. Metaprogrammer. Ex-Google Staff Engineer.",
    "worksFor": {
      "@type": "Organization",
      "name": "DeepMorph",
      "url": "https://deepmorph.ai/",
      "founder": { "@type": "Person", "name": "Jiahao Cai", "url": "https://jiahao-cai.info" }
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "University of Virginia",
      "url": "https://www.virginia.edu/"
    },
    "sameAs": [
      "https://github.com/jiahao42",
      "https://linkedin.com/in/jiahao-cai/",
      "https://x.com/_endif_",
      "https://scholar.google.com/citations?user=A-kCC9EAAAAJ",
      "https://stackoverflow.com/users/story/5685664"
    ]
  }
  </script>
{% endif %}

  <!-- The ?v= is a cache buster: it changes every build, so browsers fetch the
       new stylesheet instead of serving a stale cached copy. -->
  <!-- syntax highlighting CSS -->
  <link rel="stylesheet" href="/css/syntax.css?v={{ site.time | date: '%s' }}">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/main.css?v={{ site.time | date: '%s' }}">

  <!-- Google tag (gtag.js) - Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NGDQK62TFK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-NGDQK62TFK');
</script>

</head>

<body>
  <div class="site{% if page.layout == 'post' %} post{% endif %}">

    <div class="content">
      <main>
        <!-- begin subtemplate -->
        {{ content }}
        <!-- end subtemplate -->
      </main>
    </div>
  </div>

  </div>
</body>

</html>
